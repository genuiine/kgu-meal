<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F4F6">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101013">
  <title>경기대 밥먹자 - 수원캠퍼스 학식</title>
  <!-- M1: preload로 렌더 블로킹 해소 — 시스템 폰트 스택으로 즉시 렌더 후 스왑 -->
  <link rel="preload" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
  <style>
    /* ============ TDS TOKENS ============ */
    :root {
      --grey-50:#F9FAFB; --grey-100:#F2F4F6; --grey-200:#E5E8EB; --grey-300:#D1D6DB;
      --grey-400:#B0B8C1; --grey-500:#8B95A1; --grey-600:#6B7684; --grey-700:#4E5968;
      --grey-800:#333D4B; --grey-900:#191F28;

      --bg:#F2F4F6;
      --surface:#FFFFFF;
      --surface2:#F9FAFB;
      --text-primary:var(--grey-900);
      --text-secondary:var(--grey-600);
      --text-tertiary:var(--grey-500);
      --divider:rgba(2,32,71,.06);

      --blue:#3182F6; --blue-dark:#1B64DA; --blue-light:#E8F3FF;
      --green:#02A262; --green-bg:#E5F9F0;
      --orange:#FF9500; --orange-bg:#FFF4E5;
      --red:#F04452; --red-bg:#FDEDEE;
      /* M3: 틴트 배경 위 텍스트 전용 상태 컬러 (4.5:1 대비) — 도트·배경은 기존 토큰 유지 */
      --orange-text:#C2410C; --green-text:#067A4E;
      /* A1: red-bg 틴트 위 텍스트 전용 red (M3 누락 보완) */
      --red-text:#C4142A;
      /* A2: grey-100 배경 위 보조 텍스트 전용 강화 토큰 (4.5:1 확보) */
      --text-secondary-strong:#4E5968;

      --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;

      --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;
      --page-x:20px;

      --r-chip:999px; --r-btn:14px; --r-card:20px; --r-thumb:16px; --r-badge:8px;

      --shadow-float:0 8px 24px rgba(2,32,71,.10);
      --shadow-card:0 1px 2px rgba(2,32,71,.04);

      --ease-spring:cubic-bezier(.22,1.2,.36,1);
      --ease-out:cubic-bezier(.25,.1,.25,1);
      --dur-fast:.15s; --dur-base:.25s; --dur-sheet:.35s;

      --touch-min:44px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#101013; --surface:#1B1D21; --surface2:#222429;
        --text-primary:#E5E8EB; --text-secondary:#9BA5B1; --text-tertiary:#6B7684;
        --divider:rgba(255,255,255,.07);
        --blue-light:rgba(49,130,246,.16);
        --green-bg:rgba(2,162,98,.16); --orange-bg:rgba(255,149,0,.14); --red-bg:rgba(240,68,82,.14);
        --orange-text:#FFA938; --green-text:#3DD68C;
        --red-text:#FF6B78;
        --text-secondary-strong:#9BA5B1;
        --shadow-card:none;
      }
    }

    /* ============ BASE ============ */
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{
      font-family:var(--font);font-size:15px;font-weight:500;line-height:1.55;
      letter-spacing:-.01em;background:var(--bg);color:var(--text-primary);
      min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;
    }
    body.lock{overflow:hidden;}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;letter-spacing:inherit;}
    a{color:var(--blue);text-decoration:none;}
    :focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px;}
    .wrap{max-width:640px;margin:0 auto;padding:0 var(--page-x);}

    /* ============ BIG HEADER ============ */
    .big-header{background:var(--surface);padding-top:max(16px,env(safe-area-inset-top));}
    .bh-inner{max-width:640px;margin:0 auto;padding:16px var(--page-x) 18px;}
    .bh-caption{font-size:13px;font-weight:400;color:var(--text-secondary);margin-bottom:6px;}
    .bh-title{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.3;}
    /* 영업 요약 리스트 셀 */
    .status-cell{
      display:flex;align-items:center;gap:8px;width:100%;min-height:var(--touch-min);
      margin-top:10px;padding:10px 14px;border-radius:var(--r-btn);background:var(--grey-100);
      font-size:14px;font-weight:500;color:var(--text-secondary-strong);text-align:left;
      transition:background var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out);
    }
    @media (prefers-color-scheme: dark){.status-cell{background:var(--surface2);}}
    .status-cell:active{transform:scale(.985);}
    .sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .sdot.open{background:var(--green);box-shadow:0 0 0 3px var(--green-bg);}
    .sdot.closed{background:var(--grey-400);}
    .sdot.vac{background:var(--orange);box-shadow:0 0 0 3px var(--orange-bg);}
    .status-cell .chev{margin-left:auto;color:var(--text-tertiary);flex-shrink:0;transition:transform var(--dur-base) var(--ease-out);}
    .status-cell[aria-expanded="true"] .chev{transform:rotate(180deg);}
    .status-panel{display:none;margin-top:8px;border-radius:var(--r-btn);background:var(--grey-100);overflow:hidden;}
    @media (prefers-color-scheme: dark){.status-panel{background:var(--surface2);}}
    .status-panel.open{display:block;}
    .status-row{display:flex;align-items:center;gap:10px;min-height:var(--touch-min);padding:10px 14px;font-size:14px;}
    .status-row + .status-row{border-top:1px solid var(--divider);}
    .status-row .sr-name{font-weight:600;}
    .status-row .sr-label{margin-left:auto;font-size:14px;font-weight:500;color:var(--text-secondary);}
    .status-row .sr-label.on{color:var(--green-text);}
    .status-row .sr-label.vac{color:var(--orange-text);}

    /* ============ MINI BAR (스크롤 축소 헤더) ============ */
    .sticky-head{position:sticky;top:0;z-index:100;background:var(--surface);}
    .mini-bar{
      max-height:0;overflow:hidden;opacity:0;
      transition:max-height var(--dur-base) var(--ease-out),opacity var(--dur-base) var(--ease-out);
    }
    .sticky-head.scrolled .mini-bar{max-height:48px;opacity:1;}
    /* D1: 하강 스크롤 중 미니바만 접기 (탭바·sub필터는 유지) */
    .sticky-head.scrolled.hide-mini .mini-bar{max-height:0;opacity:0;}
    .mini-inner{max-width:640px;margin:0 auto;padding:0 var(--page-x);height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
    .mini-logo{font-size:15px;font-weight:700;letter-spacing:-.02em;}
    .mini-date{font-size:13px;font-weight:400;color:var(--text-secondary);white-space:nowrap;}
    /* P2-10: 미니바 영업 상태 축약 병기 */
    .mini-status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--text-secondary);white-space:nowrap;}

    /* ============ SEGMENT TABS ============ */
    .tab-nav{background:var(--surface);border-bottom:1px solid var(--divider);}
    .tab-scroll{
      max-width:640px;margin:0 auto;padding:0 calc(var(--page-x) - 8px);
      display:flex;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;
    }
    .tab-scroll::-webkit-scrollbar{display:none;}
    .tab-btn{
      position:relative;min-height:48px;padding:0 14px;font-size:15px;font-weight:500;
      color:var(--text-secondary);white-space:nowrap;flex-shrink:0;
      transition:color var(--dur-fast) var(--ease-out);
    }
    .tab-btn::after{
      content:'';position:absolute;bottom:0;left:12px;right:12px;height:2.5px;
      border-radius:2px 2px 0 0;background:var(--text-primary);
      transform:scaleX(0);transform-origin:center;transition:transform var(--dur-base) var(--ease-out);
    }
    .tab-btn.active{color:var(--text-primary);font-weight:700;}
    .tab-btn.active::after{transform:scaleX(1);}

    /* ============ VACATION BANNER ============ */
    .vac-banner{max-width:640px;margin:12px auto 0;padding:0 var(--page-x);}
    .vac-inner{
      display:flex;align-items:flex-start;gap:12px;padding:16px;
      border-radius:var(--r-card);background:var(--orange-bg);
      font-size:14px;font-weight:400;color:var(--grey-700);line-height:1.6;
    }
    @media (prefers-color-scheme: dark){.vac-inner{color:var(--text-secondary);}}
    .vac-ico{font-size:22px;flex-shrink:0;line-height:1.4;}
    .vac-inner b{color:var(--text-primary);font-weight:700;}
    .vac-inner .vac-strong{color:var(--orange-text);font-weight:700;}
    .vac-today{margin-top:2px;font-weight:600;}

    /* ============ SUB FILTER CHIPS (sticky-head 내부) ============ */
    .sub-filter{
      background:var(--surface);border-bottom:1px solid var(--divider);
      padding:8px var(--page-x);
      display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;
    }
    @media (min-width:640px){.sub-filter{padding-left:calc((100% - 600px)/2);padding-right:calc((100% - 600px)/2);}}
    .sub-filter::-webkit-scrollbar{display:none;}
    .chip{
      position:relative;
      display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;
      margin:4px 0;border-radius:var(--r-chip);background:var(--grey-100);
      font-size:14px;font-weight:500;color:var(--text-secondary);white-space:nowrap;flex-shrink:0;
      transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out);
    }
    @media (prefers-color-scheme: dark){.chip{background:var(--surface2);}}
    .chip:active{transform:scale(.96);}
    .chip.active{background:var(--grey-900);color:#fff;font-weight:600;}
    @media (prefers-color-scheme: dark){.chip.active{background:var(--grey-200);color:var(--grey-900);}}
    /* 시각 36px 유지 + 터치 타깃 44px 확보 */
    .chip::after{content:'';position:absolute;left:0;right:0;top:-4px;bottom:-4px;}

    /* ============ MAIN ============ */
    .main{max-width:640px;margin:0 auto;padding:16px var(--page-x) 24px;}

    /* 매장 화이트 카드 섹션 */
    .cafe-card{background:var(--surface);border-radius:var(--r-card);padding:20px;margin-bottom:12px;}
    .cafe-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .cafe-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .cafe-name{font-size:19px;font-weight:700;letter-spacing:-.02em;}
    .badge{font-size:13px;font-weight:600;padding:4px 8px;border-radius:var(--r-badge);white-space:nowrap;}
    .badge.open{background:var(--green-bg);color:var(--green-text);}
    .badge.off{background:var(--grey-100);color:var(--grey-700);}
    @media (prefers-color-scheme: dark){.badge.off{background:var(--surface2);color:var(--text-secondary);}}
    .badge.vac{background:var(--orange-bg);color:var(--orange-text);}
    .cafe-meta{font-size:14px;font-weight:400;color:var(--text-secondary);margin-top:4px;}

    /* sub 섹션 */
    .sub-section{margin-top:18px;}
    .sub-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
    .sub-name{font-size:17px;font-weight:600;letter-spacing:-.01em;}
    .sub-count{font-size:13px;font-weight:500;color:var(--text-secondary);}
    .sub-section.closed .card-thumb{filter:grayscale(.7);opacity:.7;}
    .sub-section.closed .card-name,.sub-section.closed .card-price{color:var(--text-secondary);}
    .sub-section.collapsed .menu-grid{display:none;}
    .sub-toggle{
      position:relative;
      margin-left:auto;min-height:32px;padding:0 12px;border-radius:var(--r-chip);
      background:var(--grey-100);color:var(--text-secondary);font-size:14px;font-weight:600;
      transition:transform var(--dur-fast) var(--ease-out);
    }
    @media (prefers-color-scheme: dark){.sub-toggle{background:var(--surface2);}}
    .sub-toggle:active{transform:scale(.96);}
    /* 시각 32px 유지 + 터치 타깃 44px 확보 (칩 패턴 재사용) */
    .sub-toggle::after,.more-btn::after{content:'';position:absolute;left:-4px;right:-4px;top:-6px;bottom:-6px;}
    /* 전체보기 미리보기 축약: 2열 3행=6개만 노출 */
    .sub-section.preview .menu-card:nth-child(n+7){display:none;}
    .sub-section.collapsed .more-btn{display:none;}
    .more-btn{
      position:relative;display:block;width:100%;min-height:var(--touch-min);margin-top:10px;
      border-radius:var(--r-btn);background:var(--grey-100);color:var(--text-secondary);
      font-size:14px;font-weight:600;
      transition:transform var(--dur-fast) var(--ease-out),background var(--dur-fast) var(--ease-out);
    }
    @media (prefers-color-scheme: dark){.more-btn{background:var(--surface2);}}
    .more-btn:active{transform:scale(.98);}
    /* 단독 뷰 메뉴 도구 행: 카테고리 칩 + 가격 정렬 토글 */
    .tool-row{
      display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;
      margin-bottom:12px;
    }
    .tool-row::-webkit-scrollbar{display:none;}
    /* M5: 전체보기 전역 도구 행 — 페이지 배경(grey-100) 위에서는 화이트 칩으로 대비 확보 */
    .main>.tool-row .chip{background:var(--surface);box-shadow:var(--shadow-card);}
    .main>.tool-row .chip.active{background:var(--grey-900);color:#fff;box-shadow:none;}
    @media (prefers-color-scheme: dark){
      .main>.tool-row .chip{background:var(--surface2);}
      .main>.tool-row .chip.active{background:var(--grey-200);color:var(--grey-900);}
    }

    /* ============ MENU GRID / CARD ============ */
    .menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
    @media (min-width:420px){.menu-grid{grid-template-columns:repeat(3,1fr);}}
    @media (min-width:760px){.menu-grid{grid-template-columns:repeat(4,1fr);}}
    @media (max-width:320px){.menu-grid{grid-template-columns:1fr;}}

    .menu-card{
      background:var(--surface);border:1px solid var(--divider);border-radius:var(--r-thumb);
      overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-card);
      opacity:0;transform:translateY(12px);animation:cardIn .28s var(--ease-out) forwards;
    }
    .cafe-card .menu-card{background:var(--surface2);border-color:var(--divider);}
    @keyframes cardIn{to{opacity:1;transform:translateY(0);}}
    /* 최초 렌더 이후 재렌더 시 등장 애니메이션 억제 */
    .no-anim .menu-card{animation:none;opacity:1;transform:none;}
    .card-thumb{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--grey-100);}
    .card-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
    .card-thumb--ph{display:flex;align-items:center;justify-content:center;}
    .ph-emoji{font-size:44px;line-height:1;}
    /* M4: 카테고리 색은 6px 도트로만 — 글자는 항상 고대비 primary */
    .thumb-cat{
      position:absolute;left:8px;top:8px;font-size:13px;font-weight:600;padding:3px 8px;
      display:inline-flex;align-items:center;gap:4px;color:var(--text-primary);
      border-radius:var(--r-badge);background:rgba(255,255,255,.92);backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
    }
    @media (prefers-color-scheme: dark){.thumb-cat{background:rgba(27,29,33,.9);}}
    .tc-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
    .card-body{padding:12px;display:flex;flex-direction:column;gap:2px;}
    .card-name{font-size:15px;font-weight:600;line-height:1.35;color:var(--text-primary);}
    .card-price{font-size:16px;font-weight:700;color:var(--text-primary);margin-top:2px;}
    .card-price.tbd{font-size:13px;font-weight:400;color:var(--text-secondary);}

    /* ============ SINGLE VIEW ============ */
    .single-header{display:flex;align-items:baseline;gap:10px;margin:8px 0 14px;flex-wrap:wrap;}
    .single-name{font-size:22px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;}
    .single-meta{font-size:13px;font-weight:400;color:var(--text-secondary);}
    .info-card{background:var(--surface);border-radius:var(--r-card);padding:4px 20px;margin-bottom:16px;}
    .info-row{display:flex;align-items:center;gap:10px;min-height:var(--touch-min);padding:10px 0;font-size:14px;color:var(--text-secondary);}
    .info-row + .info-row{border-top:1px solid var(--divider);}
    .info-row .ir-ico{flex-shrink:0;font-size:15px;}
    .info-row .ir-val{margin-left:auto;font-weight:600;color:var(--text-primary);text-align:right;}
    .info-row .ir-val.on{color:var(--green-text);}
    .info-row .ir-val.off{color:var(--text-secondary);}
    .info-row .ir-val.vac{color:var(--orange-text);}
    .info-row .ir-val a{color:var(--blue);}

    /* ============ FIXED BOTTOM CTA ============ */
    .bottom-cta{
      position:fixed;left:0;right:0;bottom:0;z-index:200;
      padding:12px var(--page-x) calc(12px + env(safe-area-inset-bottom));
      background:linear-gradient(to top,var(--bg) 65%,rgba(242,244,246,0));
      pointer-events:none;
    }
    @media (prefers-color-scheme: dark){.bottom-cta{background:linear-gradient(to top,var(--bg) 65%,rgba(16,16,19,0));}}
    .cta-btn{
      pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:8px;
      width:100%;max-width:600px;margin:0 auto;height:56px;border-radius:var(--r-btn);
      background:var(--blue);color:#fff;font-size:17px;font-weight:700;letter-spacing:-.01em;
      box-shadow:var(--shadow-float);
      transition:transform var(--dur-fast) var(--ease-out),filter var(--dur-fast) var(--ease-out),
        width var(--dur-base) var(--ease-out),max-width var(--dur-base) var(--ease-out),
        border-radius var(--dur-base) var(--ease-out),gap var(--dur-base) var(--ease-out);
    }
    .cta-btn:active{transform:scale(.97);filter:brightness(.96);}
    /* D1: 하강 스크롤 중 CTA를 우측 56px 원형 🎲 FAB로 축소 (하단 탭바 이동의 대체책) */
    .bottom-cta.fab-mode .cta-btn{width:56px;max-width:56px;border-radius:50%;margin-right:0;gap:0;font-size:22px;padding:0;}
    .bottom-cta.fab-mode .cta-label{display:none;}

    /* ============ BOTTOM SHEET ============ */
    .sheet-overlay{
      position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.5);
      display:flex;align-items:flex-end;justify-content:center;
      opacity:0;visibility:hidden;
      transition:opacity var(--dur-base) var(--ease-out),visibility var(--dur-base) var(--ease-out);
    }
    .sheet-overlay.open{opacity:1;visibility:visible;}
    .sheet{
      position:relative;width:100%;max-width:640px;max-height:92dvh;
      display:flex;flex-direction:column;
      background:var(--surface);border-radius:24px 24px 0 0;
      transform:translateY(100%);transition:transform var(--dur-base) var(--ease-out);
    }
    .sheet-overlay.open .sheet{transform:translateY(0);transition:transform var(--dur-sheet) var(--ease-spring);}
    .sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--grey-300);margin:10px auto 4px;flex-shrink:0;}
    .sheet-close{
      position:absolute;top:12px;right:12px;width:var(--touch-min);height:var(--touch-min);
      display:flex;align-items:center;justify-content:center;border-radius:50%;
      color:var(--text-tertiary);font-size:18px;line-height:1;z-index:2;
    }
    .sheet-close:active{background:var(--grey-100);transform:scale(.94);}
    .sheet-body{overflow-y:auto;padding:8px var(--page-x) 0;overscroll-behavior:contain;}
    .sheet-title{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:8px;}
    .sheet-sub{font-size:13px;font-weight:400;color:var(--text-secondary);margin:4px 0 16px;}

}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n){return n.toLocaleString('ko-KR')+'원';}
function nowH(){const n=new Date();return n.getHours()+n.getMinutes()/60;}
// true=영업 중, false=영업 종료, null=방학 단축운영(시간 미확인)
// 검사 순서 중요: 주말 휴무가 vacUnknown보다 먼저 (샐리박스: closedWeekend+vacUnknown → 주말엔 false)
function isOpen(c){
  const d=new Date().getDay();
  if(c.closedWeekend&&(d===0||d===6))return false;

  if(c.vacUnknown){const h=nowH();if(h<c.openH||h>=c.closeH)return false;return null;}
  if(c.vacation&&c.subs&&!c.subs.some(subOpenToday))return false; // 방학 로테이션: 오늘 운영 매장 0곳이면 휴무
  const h=nowH();return h>=c.openH&&h<c.closeH;

  const D=['일','월','화','수','목','금','토'],n=new Date();
  return `${n.getFullYear()}.${String(n.getMonth()+1).padStart(2,'0')}.${String(n.getDate()).padStart(2,'0')} (${D[n.getDay()]})`;
}
function headTitleStr(){
  const D=['일','월','화','수','목','금','토'],n=new Date();
  const h=nowH();
  const emo=h<11?'☀️':(h<17?'🍚':'🌙');
  return `${n.getMonth()+1}월 ${n.getDate()}일 ${D[n.getDay()]}요일 ${emo}`;
}
function todayStr(){
  const n=new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}
// 방학 로테이션: sub.days 스케줄에 오늘이 포함되면 운영. days 없으면 상시 운영으로 간주
function subOpenToday(sub){
  if(!sub.days||!sub.days.length)return true;
  const t=todayStr();
  return sub.days.some(([f,to])=>t>=f&&t<=to);
}
// M6: 오늘이 속한 운영 기간의 종료일 - 'M/D' 문자열 또는 null (운영 중 sub 전용)
function subCurrentRangeEnd(sub){
  if(!sub.days||!sub.days.length)return null;
  const t=todayStr();
  const cur=sub.days.find(([f,to])=>t>=f&&t<=to);
  if(!cur)return null;
  const [,m,d]=cur[1].split('-');
  return `${parseInt(m)}/${parseInt(d)}`;
}
// 다음 운영 시작일 (오늘 휴무인 경우) - 'M/D' 문자열 또는 null
function subNextOpen(sub){
  if(!sub.days||!sub.days.length)return null;
  const t=todayStr();
  const upcoming=sub.days.map(([f])=>f).filter(f=>f>t).sort();
  if(!upcoming.length)return null;
  const [,m,d]=upcoming[0].split('-');
  return `${parseInt(m)}/${parseInt(d)}`;
}
function allMenus(cafe){
  if(cafe.type==='foodcourt')return cafe.subs.flatMap(s=>s.menus.map(m=>({...m,subName:s.name,cafeName:cafe.name,cafeColorHex:cafe.colorHex})));
  return (cafe.menus||[]).map(m=>({...m,subName:'',cafeName:cafe.name,cafeColorHex:cafe.colorHex}));
}
function openLabel(open){return open===null?'방학 단축운영':(open?'영업 중':'영업 종료');}
function openCls(open){return open===null?'vac':(open?'open':'closed');}
/* P3: 위치 → 네이버지도 검색 딥링크 (콘텐츠 링크 — CDN 자원 아님) */
function mapLink(c){
  return`<a href="https://map.naver.com/p/search/${encodeURIComponent('경기대학교 '+c.location)}" target="_blank" rel="noopener">${esc(c.location)} ↗</a>`;
}
/* P2-2: 가로 스크롤 칩 행 페이드 마스크 동적 토글 — 오른쪽에 잘린 내용이 있을 때만.
   resize는 전역 1개 리스너로 처리 (재렌더 시 리스너 누적 방지, 분리된 노드는 자동 정리) */
const fadeEls=new Set();
function fadeUpd(el){el.classList.toggle('has-fade',el.scrollWidth>el.clientWidth&&el.scrollLeft<el.scrollWidth-el.clientWidth-4);}
function bindFade(el){
  if(!el)return;
  if(!fadeEls.has(el)){
    fadeEls.add(el);
    el.addEventListener('scroll',()=>fadeUpd(el),{passive:true});
  }
  fadeUpd(el);
}
window.addEventListener('resize',()=>{
  fadeEls.forEach(el=>{if(el.isConnected)fadeUpd(el);else fadeEls.delete(el);});
});

/* ============================================================
   HEADER STATUS (지금 영업 요약 + 식당별 상태 패널)
============================================================ */
function renderStatus(){
  const states=CAFES.map(c=>({c,open:isOpen(c)}));
  const openCnt=states.filter(s=>s.open===true).length;
  const vacCnt=states.filter(s=>s.open===null).length;
  const dot=document.getElementById('statusDot');
  const sum=document.getElementById('statusSummary');
  // B5: 영업 1~2곳이면 매장명 병기 — '몇 곳'보다 '어디'가 실사용 정보
  if(openCnt>0){
    dot.className='sdot open';
    const openNames=states.filter(s=>s.open===true).map(s=>s.c.name);
    sum.textContent=(openCnt<=2?`지금 영업 중 · ${openNames.join(' · ')}`:`지금 영업 중 ${openCnt}곳`)
      +(vacCnt?` · 단축운영 ${vacCnt}곳`:'');
  }
  else if(vacCnt>0){dot.className='sdot vac';sum.textContent=`영업 중 0곳 · 방학 단축운영 ${vacCnt}곳`;}
  else {dot.className='sdot closed';sum.textContent='지금 영업 중인 식당이 없어요';}
  // P2-10: 미니바 상태 축약 동기 갱신
  const mdot=document.getElementById('miniDot'),mlab=document.getElementById('miniLabel');
  if(mdot&&mlab){
    if(openCnt>0){mdot.className='sdot open';mlab.textContent=`영업 ${openCnt}곳`;}
    else if(vacCnt>0){mdot.className='sdot vac';mlab.textContent=`단축 ${vacCnt}곳`;}
    else {mdot.className='sdot closed';mlab.textContent='영업 종료';}
  }
  document.getElementById('statusPanel').innerHTML=states.map(({c,open})=>{
    // 방학 로테이션 식당은 오늘 운영 sub 병기 (예: '영업 중 · 숑숑돈까스')
    let label=open===null?'🌴 '+openLabel(open):openLabel(open);
    if(c.vacation&&c.subs&&open!==false){
      const names=(c.subs||[]).filter(subOpenToday).map(s=>esc(s.name));
      if(names.length)label=`${openLabel(open)} · ${names.join(' · ')}`;
    }
    return`<div class="status-row">
      <span class="sdot ${openCls(open)}"></span>
      <span class="sr-name">${esc(c.name)}</span>
      <span class="sr-label ${open===null?'vac':(open?'on':'')}">${label}</span>
    </div>`;
  }).join('');
}

/* ============================================================
   VACATION BANNER (방학 단축운영 + 오늘 운영 매장)
============================================================ */
function todayShort(){const n=new Date();return`${n.getMonth()+1}/${n.getDate()}`;}
function renderVacBanner(){

  el.style.display='block';

  el.innerHTML=`<div class="vac-inner">
    <span class="vac-ico">🌴</span>
    <div>
      <b>${esc(c.name)} 여름방학 단축운영</b> · 월~금 ${esc(c.hours)} (${esc(c.lastOrder)})
      <div class="vac-today">오늘 ${todayShort()} 운영 · ${openSubs.length?`<b class="vac-strong">${openSubs.map(esc).join(' · ')}</b>`:'<b class="vac-strong">휴무</b>'}${others.length?` · ${others.map(esc).join('·')} 시간 미확인`:''}</div>
    </div>

}

/* ============================================================
   MENU CARD
============================================================ */
function menuCard(m,idx){
  const cat=CAT_MAP[m.cat]||{label:m.cat||'',color:'#9CA3AF',bg:'rgba(156,163,175,.12)',emoji:'🍽️'};
  const delay=(Math.min(idx,10)*.03).toFixed(2);
  // M4: 카테고리 색은 도트에만 — 라벨은 고대비 primary 고정
  const catTag=`<span class="thumb-cat"><span class="tc-dot" style="background:${cat.color}"></span>${cat.label}</span>`;
  const thumb=m.img
    ?`<div class="card-thumb"><img src="${esc(m.img)}" alt="${esc(m.name)}" loading="lazy" decoding="async">
        ${catTag}</div>`
    :`<div class="card-thumb card-thumb--ph" style="background:${cat.bg}">
        <span class="ph-emoji">${cat.emoji||'🍽️'}</span>
        ${catTag}</div>`;
  return`<div class="menu-card" style="animation-delay:${delay}s">
    ${thumb}
    <div class="card-body">
      <div class="card-name">${esc(m.name)}</div>
      <div class="card-price${m.tbd?' tbd':''}">${priceLabel(m)}</div>
    </div>
  </div>`;
}

/* ============================================================
   RENDER MAIN
============================================================ */
function cafeBadge(open){
  return open===null?`<span class="badge vac">🌴 방학 단축운영</span>`
    :(open?`<span class="badge open">영업 중</span>`:`<span class="badge off">영업 종료</span>`);
}
function subBadge(c,s){
  if(!c.vacation)return'';
  const on=subOpenToday(s), nx=subNextOpen(s);
  if(on){
    const end=subCurrentRangeEnd(s); // M6/P2-9: 종료일 명시 — '~7/30'의 방향 모호성 제거
    return`<span class="badge open">오늘 운영${end?` · ${end}까지 운영`:''}</span>`;
  }
  // P2-9: days 전 기간 종료 sub는 '로테이션 종료'로 사실만 (미래 추정 문구 금지 — 라운드3 원칙)
  const ended=s.days&&s.days.length&&s.days.every(([,to])=>to<todayStr());
  return`<span class="badge off">오늘 휴무${nx?` · ${nx} 오픈`:(ended?' · 방학 로테이션 종료':' · 운영 일정 확인 중')}</span>`;
}
/* 단독 뷰 메뉴 도구 행: 보유 카테고리 칩 + 가격 낮은순 토글 (state: mainCat/sortPrice) */
function menuToolRow(menus){
  if(menus.length<2)return'';
  const cats=[...new Set(menus.map(m=>m.cat))].filter(k=>CAT_MAP[k]);
  // B2: 정렬 칩을 2번째로 — 스크롤 없이 항상 보이는 위치
  return`<div class="tool-row">
    <button class="chip${mainCat==='all'?' active':''}" data-mcat="all">전체</button>
    <button class="chip${sortPrice?' active':''}" data-sort="price" aria-pressed="${sortPrice}">↓ 가격 낮은순</button>
    ${cats.map(k=>`<button class="chip${mainCat===k?' active':''}" data-mcat="${k}">${CAT_MAP[k].label}</button>`).join('')}
  </div>`;
}
function applyMenuTools(menus){
  let ms=mainCat==='all'?menus:menus.filter(m=>m.cat===mainCat);
  if(sortPrice)ms=[...ms].sort((a,b)=>a.price-b.price||(a.tbd?1:0)-(b.tbd?1:0)); // P2-2: 추정가 우선 정렬, tbd는 동가 후순위 (비파괴)
  return ms;
}
/* forceExpand: 휴무 sub를 직접 선택했을 때 접힘 해제 + 전용 도구 행 표시.
   M5: 도구(mainCat/sortPrice)는 운영 sub 전체에 적용 — 휴무 collapsed sub는 대상 외 */
function subSection(c,s,forceExpand){
  if(!s.menus.length)return'';
  const on=subOpenToday(s);
  const closed=c.vacation&&!on;
  const key=`${CAFES.indexOf(c)}-${s.name}`;
  const collapsible=closed&&!forceExpand;
  const collapse=collapsible&&!expandedSubs.has(key);
  const toolTarget=forceExpand||!closed||!collapse; // P2-7: 펼친 휴무 sub에도 도구 적용 (필터-화면 불일치 해소)
  const ms=toolTarget?applyMenuTools(s.menus):s.menus;
  // B1①: 전체보기 전역 필터에서 매치 0인 운영 sub는 섹션째 생략 (단독 뷰는 현행 .empty 유지)
  if(curTab==='all'&&!forceExpand&&!closed&&toolTarget&&!ms.length)return'';
  // 전체보기 한정 미리보기 축약 (운영 sub · 6개 초과 · collapsed와 독립 · 도구 사용 중엔 비활성)
  const preview=curTab==='all'&&!closed&&s.menus.length>6&&!previewOpen.has(key)&&mainCat==='all'&&!sortPrice;
  return`<div class="sub-section${closed?' closed':''}${collapse?' collapsed':''}${preview?' preview':''}" data-key="${esc(key)}">
    <div class="sub-head">
      <span class="sub-name">${esc(s.name)}</span>
      <span class="sub-count">${preview?`6/${s.menus.length}개`:`${ms.length}개`}</span>
      ${subBadge(c,s)}
      ${collapsible?`<button class="sub-toggle" aria-expanded="${String(!collapse)}">${collapse?'메뉴 보기':'접기'}</button>`:''}
    </div>
    ${forceExpand?menuToolRow(s.menus):''}
    ${toolTarget&&!ms.length
      ?(curTab==='all'?`<div class="empty-slim">해당 카테고리 없음</div>`:`<div class="empty">이 카테고리 메뉴가 없어요</div>`)
      :`<div class="menu-grid">${ms.map((m,i)=>menuCard(m,i)).join('')}</div>`}
    ${preview?`<button class="more-btn">메뉴 ${s.menus.length}개 전체 보기</button>`:''}
  </div>`;
}

function renderMain(){
  const root=document.getElementById('mainContent');
  const subFilter=document.getElementById('subFilter');
  fadeEls.forEach(el=>{if(!el.isConnected)fadeEls.delete(el);}); // P2-6: 분리 노드 즉시 정리

  if(curTab==='all'){
    subFilter.style.display='none';
    // M5: 전체보기 전역 도구 행 — 오늘 운영 섹션의 메뉴 합집합 기준, 운영 섹션 전체에 적용
    const globalMenus=CAFES.flatMap(c=>c.type==='foodcourt'
      ?c.subs.filter(s=>!c.vacation||subOpenToday(s)).flatMap(s=>s.menus)
      :(c.menus||[]));
    // B3: 영업 종료(false) 매장을 뒤로 — stable 정렬, 원본 ci 보존 (previewOpen/expandedSubs 키·탭 매핑 불변)
    root.innerHTML=menuToolRow(globalMenus)+CAFES.map((c,ci)=>({c,ci,open:isOpen(c)}))
      .sort((a,b)=>(b.open!==false)-(a.open!==false))
      .map(({c,ci,open})=>{
      let body='';
      if(c.type==='foodcourt'){
        // 오늘 운영 매장 우선 (stable sort — 그룹 내 data.js 순서 유지, 위델가 최우선)
        const sorted=[...c.subs].sort((a,b)=>subOpenToday(b)-subOpenToday(a));
        body=sorted.map(s=>subSection(c,s)).join('');
        // B1③: 전역 필터에 매치되는 sub가 0이면 헤더+한 줄 안내만
        if(mainCat!=='all'){
          const anyMatch=sorted.some(s=>{
            if(!s.menus.length)return false;
            const on=subOpenToday(s);
            const closed=c.vacation&&!on;
            const expanded=expandedSubs.has(`${ci}-${s.name}`);
            return(!closed||expanded)&&applyMenuTools(s.menus).length>0;
          });
          if(!anyMatch)body=`<div class="empty-slim">해당 카테고리 없음</div>`;
        }
      } else {
        const ms0=c.menus||[];
        const ms=applyMenuTools(ms0); // M5: 전역 도구 적용
        const key=`${ci}-`;
        const preview=ms0.length>6&&!previewOpen.has(key)&&mainCat==='all'&&!sortPrice; // 전체보기 미리보기 축약 (normal 공통)
        body=ms0.length
          ?(ms.length
            ?`<div class="sub-section${preview?' preview':''}" data-key="${esc(key)}">
                <div class="menu-grid">${ms.map((m,i)=>menuCard(m,i)).join('')}</div>
                ${preview?`<button class="more-btn">메뉴 ${ms0.length}개 전체 보기</button>`:''}
              </div>`
            :`<div class="empty-slim">해당 카테고리 없음</div>`)
          :`<div class="empty">메뉴 데이터 준비 중 - 편집기에서 추가해주세요</div>`;
      }
      return`<section class="cafe-card">
        <div class="cafe-head">
          <span class="cafe-dot" style="background:${c.colorHex}"></span>
          <span class="cafe-name">${esc(c.name)}</span>
          ${cafeBadge(open)}
        </div>
        <div class="cafe-meta">${c.type==='foodcourt'?`푸드코트 · 코너 ${c.subs.length}곳 · `:''}${mapLink(c)} · ${open===null?`평시 ${esc(c.hours)} · 단축운영 시 변동`:esc(c.hours)}</div>
        ${body}
      </section>`;
    }).join('');

  } else {
    const ci=parseInt(curTab);
    const c=CAFES[ci];
    const open=isOpen(c);

    if(c.type==='foodcourt'){
      // sub 필터칩 (data.js subs 순서 그대로 — 위델가 첫 번째)
      subFilter.style.display='flex';
      subFilter.innerHTML=`<button class="chip ${curSub==='all'?'active':''}" data-sub="all">전체</button>`
        +c.subs.map((s,i)=>{
          const on=subOpenToday(s);
          return`<button class="chip ${curSub===String(i)?'active':''}" data-sub="${i}">${esc(s.name)}${c.vacation&&!on?' · 휴무':''}</button>`;
        }).join('');
      subFilter.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{
        curSub=ch.dataset.sub; mainCat='all'; sortPrice=false; renderMain(); // sub 전환 시 도구 리셋
      }));

      const activeSubs=curSub==='all'
        ?[...c.subs].sort((a,b)=>subOpenToday(b)-subOpenToday(a)) // 오늘 운영 우선, stable
        :[c.subs[parseInt(curSub)]];
      // 휴무 sub 직접 선택 시 접힘 해제(forceExpand) + 도구 행 표시
      const body=activeSubs.map(s=>s.menus.length?subSection(c,s,curSub!=='all'):`<div class="empty">메뉴 없음</div>`).join('');
      const openSubs=(c.subs||[]).filter(subOpenToday).map(s=>esc(s.name)).join(' · ');
      // M5: 푸드코트 '전체' 뷰 상단 도구 행 — 오늘 운영 sub 메뉴 합집합 기준
      const fcToolRow=curSub==='all'
        ?menuToolRow(c.subs.filter(s=>!c.vacation||subOpenToday(s)).flatMap(s=>s.menus))
        :'';

      root.innerHTML=`<div>
        <div class="single-header">
          <div class="single-name"><span class="cafe-dot" style="background:${c.colorHex}"></span>${esc(c.name)}</div>
          <div class="single-meta">푸드코트 · ${c.subs.reduce((a,s)=>a+s.menus.length,0)}개 메뉴</div>
        </div>
        <div class="info-card">
          <div class="info-row"><span class="ir-ico">📍</span>위치<span class="ir-val">${mapLink(c)}</span></div>
          <div class="info-row"><span class="ir-ico">🕐</span>운영시간<span class="ir-val">${open===null?`평시 ${esc(c.hours)} · 단축운영 시 변동`:esc(c.hours)}</span></div>
          <div class="info-row"><span class="ir-ico">🍽️</span>영업 상태<span class="ir-val ${open===null?'vac':(open?'on':'off')}">${open===null?'🌴 여름방학 단축운영 중':(open?'지금 영업 중':'영업 종료')}</span></div>
          <div class="info-row"><span class="ir-ico">📅</span>휴무<span class="ir-val off">${c.vacation?'🌴 방학 단축 · 주말 휴무':'주말 휴무'}</span></div>
          ${c.vacation?`<div class="info-row"><span class="ir-ico">🌴</span>오늘 운영<span class="ir-val vac">${openSubs||'휴무'}</span></div>`:''}
        </div>
        <div class="cafe-card">${fcToolRow}${body}</div>
      </div>`;

    } else {
      subFilter.style.display='none';
      const ms=c.menus||[];
      const fms=applyMenuTools(ms);
      root.innerHTML=`<div>
        <div class="single-header">
          <div class="single-name"><span class="cafe-dot" style="background:${c.colorHex}"></span>${esc(c.name)}</div>
          <div class="single-meta">${ms.length}개 메뉴</div>
        </div>
        <div class="info-card">

          :`<div class="empty">메뉴 데이터 준비 중 - <a class="foot-link" href="menu-editor.html">편집기</a>에서 추가</div>`}
      </div>`;
    }

  document.querySelectorAll('.tool-row').forEach(bindFade);

/* ============================================================
   POOL / RANDOM (오늘 실제 운영 중인 식당/매장의 메뉴만)
============================================================ */
function poolMenus(cafe){
  if(!cafeOpenTodayDate(cafe))return[]; // 주말 휴무 등 오늘 문 닫는 식당 제외
  if(cafe.type==='foodcourt')
    return cafe.subs
      .filter(s=>!cafe.vacation||subOpenToday(s)) // 방학 로테이션: 오늘 운영 매장만
      .flatMap(s=>s.menus.map(m=>({...m,subName:s.name,cafeName:cafe.name,cafeColorHex:cafe.colorHex})));
  return (cafe.menus||[]).map(m=>({...m,subName:'',cafeName:cafe.name,cafeColorHex:cafe.colorHex}));
}
// '지금 영업 중만' ON이면 영업 종료(false) 식당 제외 — null(vacUnknown)은 배제 근거 없어 유지
function cafeInPool(c){
  return !(openNowOnly&&isOpen(c)===false);
}
function priceMatch(m){
  if(filterPrice!=='all'&&m.tbd)return false; // 가격 미확인 메뉴는 가격 필터 시 제외
  if(filterPrice==='low'&&m.price>5000)return false;
  if(filterPrice==='mid'&&(m.price<=5000||m.price>=9000))return false;
  if(filterPrice==='high'&&m.price<9000)return false;
  return true;
}
function getPool(){
  const all=[];
  CAFES.forEach((c,ci)=>{
    if(filterCafe!=='all'&&parseInt(filterCafe)!==ci)return;
    if(!cafeInPool(c))return;
    const ms=poolMenus(c);
    ms.forEach(m=>{
      if(filterCat==='all'&&m.cat==='drink')return; // P2-8: '전체' 스핀에서 음료 제외 — 음료·카페 칩 직접 선택 시만 포함
      if(filterCat!=='all'&&m.cat!==filterCat)return;
      if(!priceMatch(m))return;
      all.push({...m,cafeIdx:ci});
    });
  });
  return all;
}
// 카테고리별 풀 개수 (filterCafe·filterPrice·영업중 토글 적용, filterCat 무시) — 0개 칩 비활성용
function catPoolCounts(){
  const counts={};
  CAFES.forEach((c,ci)=>{
    if(filterCafe!=='all'&&parseInt(filterCafe)!==ci)return;
    if(!cafeInPool(c))return;
    poolMenus(c).forEach(m=>{
      if(!priceMatch(m))return;
      counts[m.cat]=(counts[m.cat]||0)+1;
    });
  });
  return counts;
}
/* 카테고리 칩 동적 렌더 — CAT_MAP 단일 소스 (라벨 불일치 원천 차단) */
function renderCatFilterChips(){
  document.getElementById('catFilter2').innerHTML=
    `<button class="chip ${filterCat==='all'?'active':''}" data-cat="all">전체</button>`+
    Object.entries(CAT_MAP).map(([k,v])=>
      `<button class="chip ${filterCat===k?'active':''}" data-cat="${k}">${v.label}</button>`).join('');
  updateCatChipStates();
  bindFade(document.getElementById('catFilter2'));
}
function updateCatChipStates(auto){
  const counts=catPoolCounts();
  // 활성 카테고리가 0개가 되면 '전체'로 리셋해 막다른 상태 해소 (재호출 1회 — filterCat='all'이라 재귀 안전)
  // P2-4: auto(60초 갱신) 경로에서는 사용자가 고른 카테고리를 몰래 리셋하지 않음 — disabled만 갱신
  if(!auto&&filterCat!=='all'&&!(counts[filterCat]>0)){filterCat='all';renderCatFilterChips();return;}
  document.querySelectorAll('#catFilter2 .chip').forEach(ch=>{
    const k=ch.dataset.cat;
    if(k==='all')return;
    const dis=!(counts[k]>0);
    ch.disabled=dis;
    // P2-13: 비활성 사유 가시화 — 라벨에 ' · 0' 병기 + 툴팁
    ch.textContent=dis?`${CAT_MAP[k].label} · 0`:CAT_MAP[k].label;
    if(dis)ch.title='지금 조건에서 뽑을 메뉴가 0개예요';else ch.removeAttribute('title');
  });
}

function updatePoolCount(auto){
  updateCatChipStates(auto); // P2-4: auto 전파 — 자동 갱신은 filterCat 리셋 없이 disabled만
  const pool=getPool();
  const n=pool.length;
  // P2-1: 풀 0개 원인 탐지 — boolean 플래그(가격대 → 영업중 토글 → 카테고리 휴무 순)
  let zeroMsg='',openCause=false;
  if(n===0){
    let priceCause=false;
    if(filterPrice!=='all'){
      const p0=filterPrice;filterPrice='all';
      priceCause=getPool().length>0;
      filterPrice=p0;
    }
    if(!priceCause&&openNowOnly){
      openNowOnly=false;
      openCause=getPool().length>0;
      openNowOnly=true;
    }
    const catCause=filterCat!=='all'; // P2-4 auto 경로에서 리셋이 생략되므로 도달 가능
    zeroMsg=priceCause?'이 조건의 가격대 메뉴가 없어요 — 가격대를 넓혀보세요'
      :openCause?'지금 영업 중 매장에 없어요'
      :catCause?'이 카테고리 매장은 오늘 휴무예요'
      :'오늘 뽑을 수 있는 메뉴가 없어요';
  }
  document.getElementById('poolMsg').innerHTML=n===0
    ?esc(zeroMsg)+(openCause?`<br><button class="chip" id="poolFixBtn">영업시간 무시하고 보기</button>`:'')
    :`지금 <strong id="poolNum">${n}</strong>개 메뉴에서 뽑을 수 있어요`;
  // C2: 원인이 openNowOnly일 때 즉시 해결 버튼 — 칩 클릭 로직 재사용 (상태 이중화 금지)
  const fixBtn=document.getElementById('poolFixBtn');
  if(fixBtn)fixBtn.addEventListener('click',()=>document.getElementById('openNowChip').click());
  document.getElementById('btnSpin').disabled=n===0;
  // 가격 필터 적용 시 tbd(가격 미확인) 메뉴가 몇 개 빠졌는지 안내
  let tbdCnt=0;
  if(filterPrice!=='all'){
    CAFES.forEach((c,ci)=>{
      if(filterCafe!=='all'&&parseInt(filterCafe)!==ci)return;
      if(!cafeInPool(c))return;
      poolMenus(c).forEach(m=>{
        if(filterCat==='all'&&m.cat==='drink')return; // P2-8 정합: '전체' 풀 기준과 동일 모수
        if(filterCat!=='all'&&m.cat!==filterCat)return;
        if(m.tbd)tbdCnt++;
      });
    });
  }
  let hint=openNowOnly?'영업 종료·주말·방학 휴무 매장은 제외됩니다':'주말·방학 로테이션 휴무 매장은 제외됩니다';
  if(filterCat==='all')hint+=' · 음료·카페는 칩 선택 시에만 포함'; // P2-8 고지
  // B1: '지금 영업 중만' ON일 때 풀에 남은 vacUnknown(시간 미확인) 매장 정직 고지
  if(openNowOnly){
    const vacInPool=CAFES.filter((c,ci)=>c.vacUnknown&&pool.some(m=>m.cafeIdx===ci)).length;
    if(vacInPool)hint+=` · 단축운영(시간 미확인) ${vacInPool}곳 포함`;
  }
  if(tbdCnt)hint+=` · 가격 확인 중 ${tbdCnt}개 제외`;
  document.getElementById('poolHint').textContent=hint;
}

function doSpin(quick){
  if(isSpinning)return;
  let pool=getPool();
  if(!pool.length)return;
  // P2-9: 핑퐁 방지 — 히스토리 3건 전부 제외, 비면 직전 1건만 제외, 그래도 비면 전체 풀
  if(pool.length>1&&spinHistory.length){
    const excl=list=>pool.filter(m=>!list.some(p=>p.name===m.name&&p.cafeName===m.cafeName));
    let rest=excl(spinHistory);
    if(!rest.length)rest=excl([spinHistory[0]]);
    if(rest.length)pool=rest;
  }
  isSpinning=true;
  document.getElementById('btnSpin').textContent='추천 중...';
  let count=0,total=quick?8:22;
  const ra=document.getElementById('resultArea');
  clearInterval(spinTimer);
  spinTimer=setInterval(()=>{
    const r=pool[Math.floor(Math.random()*pool.length)];
    const e=menuEmoji(r);
    ra.innerHTML=`<div class="result-spinning">
      <span class="rs-emoji">${e}</span>
      <div class="rs-name">${esc(r.name)}</div>
      <div class="rs-cafe">${esc(r.cafeName)}${r.subName?' · '+esc(r.subName):''}</div>
    </div>`;
    count++;
    if(count>=total){
      clearInterval(spinTimer);
      const chosen=pool[Math.floor(Math.random()*pool.length)];
      const cafe=CAFES[chosen.cafeIdx];
      // P2-10: 로테이션 종료 임박 데이터 코멘트를 후보에 추가 (해당 sub 한정)
      const subRef=chosen.subName?(cafe.subs||[]).find(s=>s.name===chosen.subName):null;
      const subEnd=subRef?subCurrentRangeEnd(subRef):null;
      const cands=subEnd?COMMENTS.concat(`${chosen.subName}는 ${subEnd}까지 운영해요.`):COMMENTS;
      lastComment=cands[Math.floor(Math.random()*cands.length)];
      lastChosen=chosen;
      spinHistory.unshift(chosen);
      if(spinHistory.length>3)spinHistory.pop();
      saveSpinHistory();
      showResultCard();
      renderHistory();
      isSpinning=false;
      document.getElementById('btnSpin').textContent='다시 추천'; // P2-13: 결과 후 하단 CTA도 재추천 의미로
      ra.scrollIntoView({block:'nearest',behavior:'smooth'}); // 결과 카드 가시성 확보
    }
  },72);
}

/* P2-5: 결과 카드 생성 분리 — refreshStatus가 영업 라벨·경고만 최신 상태로 재렌더 (재스핀 없음) */
function renderResultCard(chosen){
  const cafe=CAFES[chosen.cafeIdx];
  const open=isOpen(cafe);
  // C1: 사진 있는 메뉴는 96px 라운드 썸네일, 없으면 이모지 폴백 (스핀 중 카드는 이모지 유지)
  const visual=chosen.img
    ?`<img class="rf-thumb" src="${esc(chosen.img)}" alt="${esc(chosen.name)}">`
    :`<span class="rf-emoji">${menuEmoji(chosen)}</span>`;
  return`<div class="result-final">
    ${visual}
    <div class="rf-cafe"><span class="cafe-dot" style="background:${cafe.colorHex}"></span>${esc(cafe.name)}</div>
    ${chosen.subName?`<div class="rf-sub">${esc(chosen.subName)}</div>`:''}
    <div class="rf-name">${esc(chosen.name)}</div>
    <div class="rf-price${chosen.tbd?' tbd':''}">${priceLabel(chosen)}</div>
    ${open===false?`<div class="rf-warn">⚠️ 지금은 영업 종료 · ${esc(cafe.hours)} 운영</div>`:''}
    ${open===null?`<div class="rf-warn vac">⚠️ 방학 단축운영 — 평시 ${esc(cafe.hours)} 기준, 방문 전 확인</div>`:''}
    <div class="rf-info">
      <div class="rf-info-row">📍 <span style="font-weight:600;color:var(--text-primary)">${esc(cafe.name)}</span> · <span>${esc(cafe.location)}</span></div>
      <div class="rf-info-row">🕐 <span>${open===null?'방학 단축운영 · 시간 확인 중':esc(cafe.hours)}</span>
        ${open===null?'':`<span class="${open?'on':'off'}">${open?'지금 영업 중':'영업 종료'}</span>`}
      </div>
    </div>
    <button class="rf-again" id="btnAgain">다시 추천</button>
    <div class="rf-comment">"${esc(lastComment)}"</div>
  </div>`;
}
function showResultCard(){
  if(!lastChosen)return;
  document.getElementById('resultArea').innerHTML=renderResultCard(lastChosen);
  document.getElementById('btnAgain').addEventListener('click',()=>{isSpinning=false;doSpin(true);});
}

function renderHistory(){

  list.innerHTML=spinHistory.slice(0,3).map((m,i)=>
    `<div class="history-item">

      <span class="h-cafe h-shop"><span class="cafe-dot" style="background:${m.cafeColorHex}"></span><span class="h-shop-txt">${esc(m.cafeName)}${m.subName?' · '+esc(m.subName):''}</span></span>
      <span class="h-cafe h-price">${m.tbd?(m.price?'약 '+fmt(m.price):'가격 확인 중'):fmt(m.price)}</span>

document.getElementById('mainContent').addEventListener('click',e=>{
  // ① 휴무 sub 접기/펼치기 — expandedSubs Set으로 상태 승격 (refreshStatus 재렌더에도 보존)
  const t=e.target.closest('.sub-toggle');
  if(t){
    const sec=t.closest('.sub-section');
    const key=sec.dataset.key||'';
    const nowCollapsed=sec.classList.toggle('collapsed');

    t.textContent=nowCollapsed?'메뉴 보기':'접기';

  }

  const mb=e.target.closest('.more-btn');
  if(mb){
    const sec=mb.closest('.sub-section');

/* 스크롤 시 미니바 표시 (헤더 축소 전환)
   D1: 하강 스크롤 중 크롬 축소 — 미니바 접힘 + CTA를 우측 원형 FAB로. 상승 또는 정지 150ms 시 복원.
   ※하단 탭바 이동은 4라운드 연속 기각 — 이것이 대체책. prefers-reduced-motion 시 축소 비활성 */
(function(){
  const head=document.getElementById('stickyHead');
  const big=document.getElementById('bigHeader');
  const cta=document.querySelector('.bottom-cta');
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let ticking=false,lastY=Math.max(0,window.scrollY);
  function restoreChrome(){head.classList.remove('hide-mini');cta.classList.remove('fab-mode');}
  function onScroll(){
    if(ticking)return;
    ticking=true;
    requestAnimationFrame(()=>{
      const y=Math.max(0,window.scrollY); // 상단 오버스크롤(러버밴드) 음수 무시
      head.classList.toggle('scrolled',y>big.offsetHeight-10);
      if(!reduceMotion){
        const dy=y-lastY;
        const maxY=document.documentElement.scrollHeight-window.innerHeight;
        // 하강 접힘 / 상승·상단 근접 복원. 정지 시 상태 유지 — 정지 복원 타이머는 모멘텀 스크롤의
        // 이벤트 공백(>150ms)마다 접힘↔복원 진동(스윙)을 일으켜 제거함. |dy|<=6 히스테리시스로 미세 떨림 흡수,
        // 하단 러버밴드 반동(y>=maxY 부근의 역방향)은 복원 트리거에서 제외.
        if(dy>6&&y>80){head.classList.add('hide-mini');cta.classList.add('fab-mode');}
        else if((dy<-6&&y<maxY-4)||y<=80)restoreChrome();
      }
      lastY=y;
      ticking=false;
    });
  }
  window.addEventListener('scroll',onScroll,{passive:true});
  onScroll();
})();

/* ============================================================
   INIT
============================================================ */
document.getElementById('headTitle').textContent=headTitleStr();
document.getElementById('dateBadge').textContent=formatDate();
loadSpinHistory(); // 당일 추천 히스토리 복원
renderVacBanner();
renderStatus();
renderTabNav();
renderMain();
// 최초 등장 애니메이션이 끝난 뒤 재렌더 애니메이션 억제 (탭 전환 시 깜빡임 방지)
setTimeout(()=>document.getElementById('mainContent').classList.add('no-anim'),700);

/* 60초 자동 갱신 + 탭 복귀 시 갱신 — 영업 상태 시그니처가 바뀔 때만 renderMain (스크롤·애니메이션 보호) */
// P2-3: 날짜 접두 — 자정 로테이션 전환(subOpenToday 변동)도 시그니처 변화로 감지해 강제 재렌더
function calcOpenSig(){return todayStr()+'|'+CAFES.map(c=>String(isOpen(c))).join();}
let openSig=calcOpenSig();
function refreshStatus(){
  document.getElementById('headTitle').textContent=headTitleStr();
  document.getElementById('dateBadge').textContent=formatDate();
  renderStatus();
  const sig=calcOpenSig();
  const sheetOpen=document.getElementById('modalOverlay').classList.contains('open');
  if(sig!==openSig){
    openSig=sig;renderVacBanner();renderMain();
    // P2-5: 열린 시트에 결과 카드가 있으면 영업 라벨·경고만 최신화 (재스핀 없음)
    if(sheetOpen&&!isSpinning&&lastChosen&&document.querySelector('#resultArea .result-final'))showResultCard();
  }
  // P2-8+P2-4: 시트가 열려 있으면 풀 카운트·칩 상태 갱신 — auto라 filterCat 자동 리셋은 생략
  if(sheetOpen)updatePoolCount(true);
}
setInterval(refreshStatus,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshStatus();});
</script>
